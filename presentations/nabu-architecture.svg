<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">Nabu-2 implemented architecture</title><desc id="arch-desc">TAWOS adapter loads scoped SQLite history. Replay orchestrates historian, planner, three sequential specialists, data quality, critic and writer. The critic can request one revision. Scorekeeper grades outcomes and reweights patterns. A read-only API serves the dashboard.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#697461"/></marker></defs><style>.box{fill:#f3f1e9;stroke:#b5bda9;stroke-width:1.5}.green{fill:#d9ed89;stroke:#87995b;stroke-width:1.5}.dark{fill:#263328;stroke:#263328}text{font-family:Arial,Helvetica,sans-serif;fill:#20221e}.title{font-size:24px;font-weight:600;letter-spacing:-.5px}.sub{font-size:18px;fill:#59624f}.white{fill:#f3f1e9}.small{font-size:16px;fill:#59624f}.wire{fill:none;stroke:#697461;stroke-width:2;marker-end:url(#arrow)}.feedback{fill:none;stroke:#6b813e;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><rect x="8" y="18" width="245" height="108" rx="5" class="box"/><text x="28" y="52" class="title">TAWOS adapter</text><text x="28" y="80" class="sub">SQL dump / JSONL</text><text x="28" y="104" class="sub">Normalise ticket history</text><rect x="293" y="18" width="350" height="108" rx="5" class="box"/><text x="313" y="52" class="title">Scoped SQLite store</text><text x="313" y="80" class="sub">Tenant + scope + time cutoff</text><text x="313" y="104" class="sub">Tickets, links and events</text><rect x="683" y="18" width="319" height="108" rx="5" class="dark"/><text x="703" y="52" class="title white">Replay orchestrator</text><text x="703" y="80" class="sub white">Simulated clock, review &amp; score</text><text x="703" y="104" class="sub white">Atomic checkpoint / resume</text><rect x="1042" y="18" width="347" height="108" rx="5" class="green"/><text x="1062" y="52" class="title">Historian</text><text x="1062" y="80" class="sub">Mines cited patterns per scope</text><text x="1062" y="104" class="sub">Patterns retain learned weights</text><path d="M253 72H293" class="wire"/><path d="M643 72H683" class="wire"/><path d="M1002 72H1042" class="wire"/><rect x="8" y="210" width="245" height="110" rx="5" class="box"/><text x="28" y="244" class="title">Planner</text><text x="28" y="272" class="sub">Routes the epic’s tickets</text><text x="28" y="296" class="sub">to each specialist</text><rect x="293" y="170" width="350" height="190" rx="5" class="green"/><text x="313" y="204" class="title">Specialist review</text><text x="313" y="232" class="sub">Estimator</text><text x="313" y="256" class="sub">Dependency hunter</text><text x="313" y="280" class="sub">Gap finder</text><text x="313" y="304" class="sub">Sequential Python candidates</text><rect x="683" y="210" width="319" height="110" rx="5" class="box"/><text x="703" y="244" class="title">Data quality + Critic</text><text x="703" y="272" class="sub">Confidence &amp; ≥2 cited tickets</text><text x="703" y="296" class="sub">Scope checks, accept / drop</text><rect x="1042" y="210" width="347" height="110" rx="5" class="box"/><text x="1062" y="244" class="title">Writer / risk review</text><text x="1062" y="272" class="sub">Cited warnings, missing work</text><text x="1062" y="296" class="sub">P50/P90 if ≥3 past epics</text><path d="M1215 126V146H130V210" class="wire"/><text x="329" y="141" class="small">Frozen history and mined patterns</text><path d="M253 265H293" class="wire"/><path d="M643 265H683" class="wire"/><path d="M1002 265H1042" class="wire"/><path d="M840 320V391H468V360" class="feedback"/><text x="526" y="383" class="small">One revision pass to the originating specialist</text><rect x="293" y="428" width="350" height="106" rx="5" class="green"/><text x="313" y="462" class="title">Scorekeeper</text><text x="313" y="490" class="sub">Grades at epic completion</text><text x="313" y="514" class="sub">Hit +0.2 / miss −0.3 weight</text><rect x="683" y="428" width="319" height="106" rx="5" class="box"/><text x="703" y="462" class="title">Persisted run state</text><text x="703" y="490" class="sub">Reviews, warnings and scores</text><text x="703" y="514" class="sub">Patterns, cursor and agent log</text><rect x="1042" y="428" width="347" height="106" rx="5" class="box"/><text x="1062" y="462" class="title">Read-only dashboard</text><text x="1062" y="490" class="sub">Python JSON API + HTML / JS</text><text x="1062" y="514" class="sub">Polls live or replays export</text><path d="M1215 320V402H468V428" class="wire"/><text x="1010" y="391" class="small">Later outcomes</text><path d="M643 481H683" class="wire"/><path d="M1002 481H1042" class="wire"/><path d="M293 481H273V150H1215V126" class="feedback"/><text x="10" y="407" class="small">Feedback updates pattern</text><text x="10" y="430" class="small">weights, not model weights</text></svg>